version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # @types/node tracks the oldest Node the tools support (engines: >=22), so a newer major would let the reference
      # code use APIs that Node 22 doesn't have. Move it by hand when the floor moves.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # The package has no runtime dependencies: everything here is build and test tooling.
      development:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
